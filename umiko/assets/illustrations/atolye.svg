	</g>
	<path class="ln" d="M110 228 H270 M110 238 H270 M110 248 H270 M110 258 H270" stroke-width="2" opacity=".35"/>
</g>
<path class="ln" d="M140 214 H240" stroke-dasharray="2 8" stroke-width="3"/>

